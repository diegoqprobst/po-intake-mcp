[project]
name = "po-intake-mcp"
version = "0.1.0"
description = "MCP server: purchase orders from email to a validated draft order, without the model ever writing to the ERP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.3",
    "pypdf>=5.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]

[project.scripts]
po-intake-mcp = "po_intake.server:main"

[dependency-groups]
dev = ["pytest>=8", "fpdf2>=2.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/po_intake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
